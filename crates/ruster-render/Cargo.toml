[package]
name = "ruster-render"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ruster-scene = { path = "../ruster-scene" }
ruster-assets = { path = "../ruster-assets" }
pollster = "0.4"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "wayland", "x11"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "wgsl"] }
glam = "0.30"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[lints]
workspace = true
