[package]
name = "rot-behavior"
description = "Provisional bounded Lua backend for generic authored behaviors"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = "0.30"
rot-scene = { path = "../rot-scene" }
mlua = { version = "=0.12.2", path = "../../third_party/mlua", features = ["lua54", "vendored"] }
rapier3d-f64 = "0.36.1"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
