[package]
name = "ruster-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Developer-controlled native UI inspection; no listener unless explicitly enabled.
inspection = ["eframe/inspection"]

[dependencies]
ruster-core = { path = "../ruster-core" }
ruster-scene = { path = "../ruster-scene" }
ruster-render = { path = "../ruster-render" }
ruster-assets = { path = "../ruster-assets" }
ruster-behavior = { path = "../ruster-behavior" }
transform-gizmo-egui = { path = "../../third_party/transform-gizmo-egui" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "wayland", "x11", "accesskit", "clipboard"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "wgsl"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10.9"
base64 = "0.22.1"
png = "0.18.1"
tempfile = "3"

[lints]
workspace = true
