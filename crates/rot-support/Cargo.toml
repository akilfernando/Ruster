[package]
name = "rot-support"
description = "Shared JSON validation and local IPC helpers for Rot Engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
ipc = ["dep:rustix"]

[dependencies]
rustix = { version = "0.38.44", features = ["fs", "net", "process"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
