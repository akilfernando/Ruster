[package]
name = "ruster-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
inspection = ["eframe/inspection"]

[dependencies]
ruster-scene = { path = "../ruster-scene" }
ruster-assets = { path = "../ruster-assets" }
ruster-render = { path = "../ruster-render" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "wayland", "x11", "accesskit", "clipboard"] }
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "wgsl"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
