[workspace]
members = ["crates/rot-core", "crates/rot-cli", "crates/rot-viewer", "crates/rot-editor", "crates/rot-mcp", "crates/rot-scene", "crates/rot-render", "crates/rot-assets", "crates/rot-app", "crates/rot-script", "crates/rot-behavior", "examples/yard-app", "examples/motion-lab"]
resolver = "2"
exclude = ["third_party/wgpu-hal", "third_party/transform-gizmo", "third_party/transform-gizmo-egui", "third_party/mlua"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/akilfernando/Ruster"

[workspace.lints.rust]
unsafe_code = "forbid"

# Bounded upstream SPIR-V layout workaround; see third_party/wgpu-hal/ROT-PATCH.md.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }
