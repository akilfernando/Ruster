[package]
name = "ruster-motion-lab"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ruster-motion-lab"
path = "src/main.rs"

[features]
default = []
inspection = ["ruster-app/inspection"]

[dependencies]
ruster-app = { path = "../../crates/ruster-app" }
ruster-scene = { path = "../../crates/ruster-scene" }
ruster-script = { path = "../../crates/ruster-script" }
ruster-behavior = { path = "../../crates/ruster-behavior" }
ruster-assets = { path = "../../crates/ruster-assets" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"

[lints]
workspace = true
