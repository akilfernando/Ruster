[package]
name = "rot-motion-lab"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rot-motion-lab"
path = "src/main.rs"

[features]
default = []
inspection = ["rot-app/inspection"]

[dependencies]
rot-app = { path = "../../crates/rot-app", features = ["audio-output"] }
rot-scene = { path = "../../crates/rot-scene" }
rot-script = { path = "../../crates/rot-script" }
rot-behavior = { path = "../../crates/rot-behavior" }
rot-assets = { path = "../../crates/rot-assets" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"

[lints]
workspace = true
